<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Limpeza</title>
    <!-- HTML2Canvas para exportar imagem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Padroniza a fonte Arial para absolutamente todos os elementos do documento */
        *, *::before, *::after, input, button, select, textarea {
            box-sizing: border-box;
            font-family: Arial, sans-serif !important;
        }

        body {
            background-color: #cfd4da;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Botões de Ação no Topo */
        .acoes-topo {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .btn-icone {
            background: #ffffff;
            border: 1px solid #bbb;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            font-size: 18px;
        }

        .btn-icone:hover {
            background: #f0f0f0;
        }

        /* Moldura Metálica */
        .moldura-quadro {
            background-color: #bcbec0;
            padding: 18px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 2px solid #9ea0a3;
        }

        /* Folha Interna */
        .folha-container {
            background-color: #f7f7f5;
            width: 360px;
            padding: 25px 20px 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
/* Container do Check verde do Iconpacks */
.check-icon-container {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
}

.img-check {
    width: 22px;
    height: 22px;
    display: block;
}

/* Marcação verde no texto da linha concluída */
tr.concluido td {
    color: #00b074;
}


        /* Container da Logo ajustado */
        .logo-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative; /* Permite mover a logo com precisão */
    top: -30px;  /* Valore positivo move para BAIRRO, negativo para CIMA */
    left: 0px; /* Valore positivo move para DIREITA, negativo para ESQUERDA */
    margin-top: 5px;
    margin-bottom: 15px;
}
        .logo-img {
            max-width: 170px;
            height: auto;
            display: block;
        }

       /* Linha Decorativa do Título (Estrutura global) */
.titulo-box {
    width: 100%;
    border-top: 1px solid #16243e;
    position: relative;
    
    /* Posição Exata do Conjunto (Linha + Texto) */
    top: -30px;       /* Positivo desce o conjunto todo | Negativo sobe */
    left: 0px;      /* Positivo move para a direita | Negativo move para a esquerda */
    
    margin-top: 5px;
    margin-bottom: 25px; /* Espaço para a tabela não colar ao descer o título */
    text-align: center;
}

/* Texto do Título */
.titulo-texto {
    background-color: #f7f7f5;
    padding: 0 8px;
    font-size: 16px;
    font-weight: bold;
    color: #16243e;
    position: relative;
    
    /* Centralização Vertical sobre a Linha */
    top: -50px;     /* Como a fonte aumentou para 16px, ajuste entre -10px e -12px para que a linha corte exatamente o meio do texto */
    
    display: inline-block;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-align: center;
}

        /* Tabela de Dados */
        .tabela-container {
    width: 100%;
    position: relative;
    top: -30px;       /* Positivo desce a tabela | Negativo sobe */
    left: 0px;      /* Positivo move para a direita | Negativo move para a esquerda */
    margin-top: 10px; /* Distância em relação ao título */
}

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
    font-size: 11px;
    font-weight: bold;
    color: #16243e;
    padding-bottom: 8px;
    border-bottom: 1.5px solid #16243e;
    text-transform: uppercase;
    white-space: nowrap; /* Impede a quebra de linha no cabeçalho */
}

        td {
            padding: 11px 4px;
            font-size: 14px;
            color: #16243e;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:last-child td {
            border-bottom: 1.5px solid #16243e;
        }

        .col-check { width: 22%; }
        .col-data { width: 48%; }
        .col-unidade { width: 30%; }

        /* Painel de Edição Centralizado (Modal) */
        .painel-edicao-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .painel-edicao-overlay.ativo {
            display: flex;
        }

        .painel-edicao {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
            max-width: 450px;
            font-size: 13px;
        }

        .painel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .painel-header h3 {
            margin: 0;
            color: #16243e;
            font-size: 14px;
        }

        .btn-fechar {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }

        .linha-editor {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 6px;
        }

        .linha-editor input[type="date"], 
        .linha-editor input[type="text"] {
            padding: 5px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Ícones de Ação -->
    <div class="acoes-topo">
        <button class="btn-icone" id="btn-toggle-painel" title="Editar Dados">⚙️</button>
        <button class="btn-icone" id="btn-salvar-imagem" title="Salvar Imagem">💾</button>
    </div>

    <!-- Moldura de Alumínio + Folha -->
    <div class="moldura-quadro" id="area-impressao">
        <div class="folha-container">
            
            <!-- Posicionamento Centralizado da Logo -->
            <div class="logo-container">
                <img src="logo.png" alt="Logo Residencial Maria de Lourdes" class="logo-img">
            </div>

            <!-- Linha com o Título Intercalado -->
            <div >
                <span class="titulo-texto">CRONOGRAMA DE LIMPEZA DO QUARTO DO LIXO</span>
            </div>

            <!-- Tabela de Dados com Rótulos Atualizados -->
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-check">📋 CHECK</th>
                            <th class="col-data">📅 DATAS</th>
                            <th class="col-unidade">🏠 RESPONSÁVEL</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">
                        <!-- Conteúdo dinâmico -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Modal Centralizado do Painel de Edição -->
    <div class="painel-edicao-overlay" id="painelOverlay">
        <div class="painel-edicao">
            <div class="painel-header">
                <h3>Editar Informações</h3>
                <button class="btn-fechar" id="btn-fechar-painel">✕</button>
            </div>
            <div id="controles-container"></div>
        </div>
    </div>

    <script>
        const dadosIniciais = [
            { check: true, data: '2026-08-31', unidade: 'Casa 06' },
            { check: false, data: '2026-09-12', unidade: 'Casa 01' },
            { check: false, data: '2026-09-28', unidade: 'Casa 02' },
            { check: false, data: '2026-10-12', unidade: 'Casa 03' },
            { check: false, data: '2026-10-26', unidade: 'Casa 04' },
            { check: false, data: '2026-11-09', unidade: 'Casa 05' }
        ];

        function formatarDataBR(dataStr) {
            if (!dataStr) return '';
            const partes = dataStr.split('-');
            return `${partes[2]}/${partes[1]}`;
        }

        function somarDias(dataStr, dias) {
            if (!dataStr) return '';
            const dataObj = new Date(dataStr + 'T00:00:00');
            dataObj.setDate(dataObj.getDate() + dias);
            const dia = String(dataObj.getDate()).padStart(2, '0');
            const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
            return `${dia}/${mes}`;
        }

        function atualizarTabela() {
    const corpoTabela = document.getElementById('corpo-tabela');
    corpoTabela.innerHTML = '';

    // Vetor SVG exato extraído do iconpacks.net/free-icon/check-3278.html
    const svgCheck3278 = `
        <svg class="img-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path fill="#00b074" d="M256,0C114.615,0,0,114.615,0,256s114.615,256,256,256s256-114.615,256-256S397.385,0,256,0z M384.348,197.652
            l-150.8,150.8c-6.249,6.248-16.379,6.248-22.628,0l-77.268-77.269c-6.249-6.248-6.249-16.379,0-22.627
            c6.248-6.249,16.379-6.249,22.627,0l65.955,65.955l139.486-139.486c6.248-6.249,16.379-6.249,22.628,0
            C390.597,181.273,390.597,191.403,384.348,197.652z"/>
        </svg>
    `;

    dadosIniciais.forEach((item) => {
        const dataInicio = formatarDataBR(item.data);
        const dataFim = somarDias(item.data, 4);
        const intervalo = item.data ? `${dataInicio} a ${dataFim}` : '';

        const tr = document.createElement('tr');
        if (item.check) tr.classList.add('concluido');

        tr.innerHTML = `
            <td>
                <span class="check-icon-container">
                    ${item.check ? svgCheck3278 : ''}
                </span>
            </td>
            <td>${intervalo}</td>
            <td>${item.unidade}</td>
        `;
        corpoTabela.appendChild(tr);
    });
}

        function construirPainel() {
            const container = document.getElementById('controles-container');
            container.innerHTML = '';

            dadosIniciais.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'linha-editor';
                div.innerHTML = `
                    <label><input type="checkbox" id="chk-${index}" ${item.check ? 'checked' : ''}> Check</label>
                    <input type="date" id="dat-${index}" value="${item.data}">
                    <input type="text" id="uni-${index}" value="${item.unidade}" style="width: 80px;">
                `;
                container.appendChild(div);

                setTimeout(() => {
                    document.getElementById(`chk-${index}`).addEventListener('change', (e) => {
                        dadosIniciais[index].check = e.target.checked;
                        atualizarTabela();
                    });
                    document.getElementById(`dat-${index}`).addEventListener('input', (e) => {
                        dadosIniciais[index].data = e.target.value;
                        atualizarTabela();
                    });
                    document.getElementById(`uni-${index}`).addEventListener('input', (e) => {
                        dadosIniciais[index].unidade = e.target.value;
                        atualizarTabela();
                    });
                }, 0);
            });
        }

        // Eventos do Painel
        const overlay = document.getElementById('painelOverlay');
        
        document.getElementById('btn-toggle-painel').addEventListener('click', () => {
            overlay.classList.add('ativo');
        });

        document.getElementById('btn-fechar-painel').addEventListener('click', () => {
            overlay.classList.remove('ativo');
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('ativo');
            }
        });

        // Evento de Salvar Imagem
        document.getElementById('btn-salvar-imagem').addEventListener('click', () => {
            overlay.classList.remove('ativo');
            const acoes = document.querySelector('.acoes-topo');
            acoes.style.display = 'none';

            html2canvas(document.getElementById('area-impressao'), { 
                scale: 2,
                useCORS: true,
                backgroundColor: null 
            }).then(canvas => {
                acoes.style.display = 'flex';
                const link = document.createElement('a');
                link.download = 'cronograma-limpeza.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });

        construirPainel();
        atualizarTabela();
    </script>
</body>
</html>
